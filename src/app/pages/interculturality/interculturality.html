<section class="blog" id="interculturality">
  <div class="chip-row">
    @for (lang of languages; track lang) {
      <button class="chip" [class.chip--active]="isLangSelected(lang)" (click)="selectLang(lang)">
        {{ i18n.t('interculturality.languages.' + lang) }}
      </button>
    }
  </div>

  <div class="media-list">
    <div class="media-list__empty">
      {{ i18n.t('interculturality.no_content') }}
    </div>
  </div>
</section>
