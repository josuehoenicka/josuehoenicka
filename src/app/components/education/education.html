<section class="education">
  <h3 class="section-title">Certifications</h3>
  <div class="carousel-wrapper">
    <div class="carousel-track">
      @for (cert of looped; track $index) {
        <button class="carousel-card" (click)="openLightbox(cert)">
          <img [src]="cert.image" [alt]="cert.institution" />
        </button>
      }
    </div>
  </div>
</section>

@if (lightbox(); as cert) {
  <div class="lightbox" (click)="onBackdropClick($event)">
    <button class="lightbox__close" (click)="closeLightbox()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>
    <img class="lightbox__img" [src]="cert.image" [alt]="cert.institution" />
  </div>
}
