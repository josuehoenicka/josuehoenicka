<section id="hero" class="hero">
  <div class="hero__grid"></div>
  <div class="hero__horizon"></div>
  <div class="hero__stars"></div>
  <div class="hero__glow"></div>
  <div class="hero__glow hero__glow--secondary"></div>
  <div class="hero__content">
    <span class="hero__greeting">{{ i18n.t('hero.greeting') }}</span>
    <h1 class="hero__title">Josue Hoenicka</h1>
  </div>
  <button class="hero__cta" (click)="warpTo('about')">
    {{ i18n.t('hero.cta') }}
  </button>
  <div class="hero__scroll">
    <div class="scroll-line"></div>
  </div>
</section>
