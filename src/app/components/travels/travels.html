<section id="travels" class="section travels">
  <div class="container">
    <h2 class="section-title">{{ i18n.t('travels.title') }}</h2>
  </div>
  <div class="carousel-wrapper">
    <div class="carousel-track">
      @for (t of looped; track $index) {
        <button class="carousel-card" (click)="openLightbox(t)">
          <div class="carousel-card__img">
            <img [src]="t.flag" [alt]="t.country" />
          </div>
          <div class="carousel-card__footer">
            <span class="carousel-card__name">{{ t.country }}</span>
          </div>
        </button>
      }
    </div>
  </div>
</section>

@if (lightbox(); as travel) {
  <div class="lightbox" (click)="onBackdropClick($event)">
    <button class="lightbox__close" (click)="closeLightbox()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>
    <div class="lightbox__content">
      <img class="lightbox__img" [src]="travel.flag" [alt]="travel.country" />
      <a class="lightbox__link" [href]="travel.photosUrl" target="_blank" rel="noopener noreferrer">
        {{ i18n.t('travels.view_photos') }}
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17l9.2-9.2M7 7h10v10"/>
        </svg>
      </a>
    </div>
  </div>
}
