<section class="brands">
  <h3 class="section-title">Brands</h3>
  <div class="carousel-wrapper">
    <div class="carousel-track">
      @for (brand of looped; track $index) {
        <button class="carousel-card" (click)="openLightbox(brand)">
          <img [src]="brand.image" [alt]="brand.name" />
        </button>
      }
    </div>
  </div>
</section>

@if (lightbox(); as brand) {
  <div class="lightbox" (click)="onBackdropClick($event)">
    <button class="lightbox__close" (click)="closeLightbox()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>
    <div class="lightbox__content">
      <img class="lightbox__img" [src]="brand.image" [alt]="brand.name" />
      <a class="lightbox__link" [href]="brand.url" target="_blank" rel="noopener noreferrer">
        Ver landing
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17l9.2-9.2M7 7h10v10"/>
        </svg>
      </a>
    </div>
  </div>
}
