<section class="blog" id="interculturality">
  <div class="chip-row">
    @for (lang of languages; track lang) {
      <button class="chip" [class.chip--active]="isLangSelected(lang)" (click)="selectLang(lang)">
        {{ i18n.t('interculturality.languages.' + lang) }}
      </button>
    }
  </div>

  <div class="search-bar">
    <svg class="search-bar__icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" class="search-bar__input" [placeholder]="i18n.t('interculturality.search')" [value]="searchQuery()" (input)="onSearch($event)">
  </div>

  <div class="media-list">
    <div class="media-list__empty">
      {{ i18n.t('interculturality.no_content') }}
    </div>
  </div>
</section>
