<section id="education" class="section education">
  <div class="container">
    <h2 class="section-title">{{ i18n.t('education.title') }}</h2>
    <br/>
    <div class="slider">
      <div class="slider__card">
        <h3 class="slider__institution">{{ i18n.t(items[activeIndex()].key + '.institution') }}</h3>

        <!-- List of certs -->
        <ul class="slider__certs" [class.expanded]="expanded()">
          @for (item of getDescItems(); track $index) {
            <li class="slider__cert-item">{{ item }}</li>
          }
        </ul>
        @if (getDescItems().length > 3) {
          <button class="slider__toggle" (click)="toggleExpand()">
            {{ expanded() ? i18n.t('experience.show_less') : i18n.t('experience.show_more') }}
          </button>
        }
      </div>

      <div class="slider__nav">
        <button class="slider__arrow" (click)="prev()" aria-label="Previous">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <span class="slider__counter">{{ activeIndex() + 1 }} / {{ items.length }}</span>
        <button class="slider__arrow" (click)="next()" aria-label="Next">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  </div>
</section>
