<section id="about" class="section about">
  <div class="container">
    <div class="about__header">
      <h2 class="section-title">{{ i18n.t('about.title') }}</h2>

    </div>

    <div class="about__flow">
      <div class="about__quote-area">
        <div class="about__line"></div>
        <blockquote class="about__quote">
          "{{ i18n.t('about.quote') }}"
        </blockquote>
      </div>

      <div class="about__stats">
        <div class="stat">
          <span class="stat__number">{{ i18n.t('about.years') }}</span>
          <span class="stat__label">{{ i18n.t('about.years_label') }}</span>
        </div>
        <div class="stat">
          <span class="stat__number">{{ i18n.t('about.languages_count') }}</span>
          <span class="stat__label">{{ i18n.t('about.languages_label') }}</span>
        </div>
        <div class="stat">
          <span class="stat__number">{{ i18n.t('about.products') }}</span>
          <span class="stat__label">{{ i18n.t('about.products_label') }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
